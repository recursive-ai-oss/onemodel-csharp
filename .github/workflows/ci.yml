name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
          - { os: macos-latest, rid: osx-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Build output goes outside the checkout, as it does locally; the runner context is only available inside steps.
      - name: Artifacts directory
        shell: bash
        run: echo "ONEMODEL_ARTIFACTS=$RUNNER_TEMP/artifacts" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      # The browser-wasm project needs a workload, so it is built in the wasm job; everything else builds here.
      - name: Restore
        shell: bash
        run: |
          for p in tests/OneModel.Tests tests/OneModel.Gpu.Tests tests/AotSmoke tests/GpuAotSmoke tests/GuideSamples bench/Micro fuzz/OneModel.Fuzz; do dotnet restore "$p"; done
      - name: Build and test (Release, then Checked)
        shell: bash
        run: |
          for c in Release Checked; do
            for p in tests/OneModel.Tests tests/OneModel.Gpu.Tests tests/AotSmoke tests/GpuAotSmoke tests/GuideSamples bench/Micro fuzz/OneModel.Fuzz; do dotnet build "$p" -c "$c" --no-restore; done
            dotnet test --project tests/OneModel.Tests -c "$c" --no-build
            dotnet build src/OneModel.Gpu -c "$c" --no-restore
          done
      # The usage guide's code blocks are copied from tests/GuideSamples; they must be current and the samples must run.
      - name: Guide examples run
        shell: bash
        run: dotnet run --no-build -c Release --project tests/GuideSamples -- testdata/graphs
      - name: Guide code blocks match the samples
        if: runner.os == 'Linux'
        run: python3 tools/sync_guide.py --check
      # Exact mode promises the same bits on every OS and CPU: the hashes are committed, so any runner that differs fails.
      - name: Exact-mode golden hashes (JIT)
        shell: bash
        run: |
          dotnet publish tools/GoldenModels -c Release -o "$RUNNER_TEMP/golden"
          APP="$RUNNER_TEMP/golden/GoldenModels.dll" tools/golden_ci.sh jit
          ONEMODEL_THREADS=1 APP="$RUNNER_TEMP/golden/GoldenModels.dll" tools/golden_ci.sh jit
          DOTNET_EnableHWIntrinsic=0 APP="$RUNNER_TEMP/golden/GoldenModels.dll" tools/golden_ci.sh jit

  aot:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
          - { os: macos-latest, rid: osx-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Artifacts directory
        shell: bash
        run: echo "ONEMODEL_ARTIFACTS=$RUNNER_TEMP/artifacts" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Native AOT toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev
      - name: Publish AOT smoke app (warnings are errors)
        shell: bash
        run: dotnet publish tests/AotSmoke -c Release -r ${{ matrix.rid }} -o "$RUNNER_TEMP/smoke" -warnaserror
      # Only the GPU package's NativeAOT publish: the runners have no GPU, so the run is in the gpu job below.
      - name: Publish the GPU smoke app (warnings are errors)
        shell: bash
        run: dotnet publish tests/GpuAotSmoke -c Release -r ${{ matrix.rid }} -o "$RUNNER_TEMP/gpu-smoke" -warnaserror
      - name: Run AOT smoke app
        shell: bash
        run: |
          # The app exits non-zero on any failed check; its first line is a fixed self-check hash.
          out=$("$RUNNER_TEMP/smoke/AotSmoke")
          echo "$out"
          grep -qx 'self-check 4242dc5249c33625' <<< "$out"
      - name: Exact-mode golden hashes (NativeAOT)
        shell: bash
        run: |
          dotnet publish tools/GoldenModels -c Release -r ${{ matrix.rid }} -p:PublishAot=true -o "$RUNNER_TEMP/golden-aot"
          ext=""; [ "${{ runner.os }}" = Windows ] && ext=".exe"
          APP="$RUNNER_TEMP/golden-aot/GoldenModels$ext" tools/golden_ci.sh aot

  gpu:
    # Hosted runners have no GPU: the GPU package's tests run on Mesa's software Vulkan driver (lavapipe) with the Khronos validation layer,
    # whose messages fail a test. That proves correctness and validation-cleanliness, not speed; hardware is checked by hand.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Artifacts directory
        run: echo "ONEMODEL_ARTIFACTS=$RUNNER_TEMP/artifacts" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Install the Vulkan software driver, the validation layer and the Native AOT toolchain
        run: |
          sudo apt-get update
          # The layer version is pinned in tools/ci/fetch-validation-layer.sh, the one place local runs read too.
          layer=$(sed -n 's/^LAYER_PACKAGE_VERSION="\(.*\)"$/\1/p' tools/ci/fetch-validation-layer.sh)
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers "vulkan-validationlayers=$layer" clang zlib1g-dev
      - name: Restore
        run: dotnet restore tests/OneModel.Gpu.Tests && dotnet restore tests/GpuAotSmoke
      - name: GPU tests on lavapipe (validation layer on, no messages allowed)
        run: VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.json tools/ci/gpu-tests.sh
      - name: GPU NativeAOT smoke (warnings are errors)
        run: VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.json tools/ci/gpu-aot-smoke.sh "$RUNNER_TEMP/gpu-smoke"

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Artifacts directory
        run: echo "ONEMODEL_ARTIFACTS=$RUNNER_TEMP/artifacts" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Workload for browser-wasm
        run: dotnet workload install wasm-tools
      - name: Build the whole solution
        run: |
          dotnet restore OneModel.slnx
          dotnet build OneModel.slnx -c Release --no-restore
      - name: Publish the browser-wasm smoke app
        run: dotnet publish tests/WasmSmoke -c Release -o "$RUNNER_TEMP/wasm"
      # No browser is involved: node loads the published bundle and runs Main on the WebAssembly runtime.
      - name: Run it headless under node
        run: |
          out=$(node tests/WasmSmoke/main.mjs "$RUNNER_TEMP/wasm/wwwroot")
          echo "$out"
          grep -q '4242dc5249c33625' <<< "$out"
      - name: Exact-mode golden hashes on browser-wasm
        run: tools/golden_ci.sh wasm "$RUNNER_TEMP/wasm/wwwroot"

  pack:
    # Builds the packages as an artifact only; nothing is pushed anywhere.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Artifacts directory
        run: echo "ONEMODEL_ARTIFACTS=$RUNNER_TEMP/artifacts" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Pack
        run: |
          dotnet pack src/OneModel -c Release -o "$RUNNER_TEMP/packages"
          dotnet pack src/OneModel.Training -c Release -o "$RUNNER_TEMP/packages"
          dotnet pack src/OneModel.Gpu -c Release -o "$RUNNER_TEMP/packages"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: ${{ runner.temp }}/packages/*
